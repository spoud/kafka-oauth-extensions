plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'maven-publish'
}

group='io.spoud.kafka.oauth'
version='1.8-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        url = uri("https://packages.confluent.io/maven")
    }
    gradlePluginPortal()
}

dependencies {
    implementation group: 'org.apache.kafka', name: 'kafka-clients', version: '4.3.1'
    implementation(group: 'io.confluent', name: 'kafka-schema-registry-client', version: '8.3.0') {
        exclude group: 'org.apache.kafka', module: 'kafka-clients'
    }
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.1'
    implementation 'org.bitbucket.b_c:jose4j:0.9.6'
    implementation 'org.slf4j:slf4j-api:2.0.18'
    implementation 'com.azure:azure-identity:1.18.4'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.2'
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
}

test {
    useJUnitPlatform()
    testLogging {
        afterSuite { desc, result ->
            if (!desc.parent) { // will match the outermost suite
                println "Results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} successes, ${result.failedTestCount} failures, ${result.skippedTestCount} skipped)"
            }
        }
    }
}

shadowJar {
    archiveClassifier = 'all'

    // Merge all META-INF/services/* descriptors (covers other service files from bundled jars).
    // The BearerAuthCredentialProvider service file is handled by explicitly listing all providers
    // in src/main/resources/META-INF/services/... — see note in that file.
    mergeServiceFiles()

    // Exclude classes that are provided at runtime by the Kafka classpath.
    // Avoids conflicts when loaded alongside Kafka or Confluent Platform tools.
    exclude 'org/apache/kafka/**'
    exclude 'kafka/**'
    exclude 'org/slf4j/**'
    exclude 'META-INF/services/org.slf4j*'
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      from components.java
      artifactId = project.name
    }
    shadow(MavenPublication) {
      artifactId = 'extensions-shadow'
      artifact tasks.shadowJar
    }
  }
  repositories {
    maven {
      name = "GitHubPackages"
      url = "https://maven.pkg.github.com/spoud/kafka-oauth-extensions"
      credentials {
        username = System.getenv("GITHUB_ACTOR")
        password = System.getenv("GITHUB_TOKEN")
      }
    }
  }
}
