kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      certSANs:
        - kafka-oauth-extension-control-plane
        - localhost
        - 127.0.0.1
      extraArgs:
        service-account-issuer: https://k8s-issuer-proxy:8443
        service-account-jwks-uri: https://k8s-issuer-proxy:8443/openid/v1/jwks
        service-account-signing-key-file: /etc/kubernetes/pki/sa.key
        service-account-key-file: /etc/kubernetes/pki/sa.pub
